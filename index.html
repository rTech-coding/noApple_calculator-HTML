
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora Apple</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --charcoal: #303030;
      --gray: #686868;
      --orange: #ff9500;
      --white: #ffffff;
      --muted: #9a9aa0;
      --line: rgba(255,255,255,.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      background: #111111;
      color: white;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .calculator-shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255,149,0,.10),
          transparent 31%
        ),
        #111111;
    }

    .calculator-panel {
      position: relative;
      width: min(100%, 430px);
      min-height: min(850px, calc(100vh - 36px));

      display: flex;
      flex-direction: column;

      overflow: hidden;

      border: 1px solid rgba(255,255,255,.18);
      border-radius: 42px;

      box-shadow:
        0 24px 68px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.07);

      background: #000;
    }

    /* -------------------------
       BARRA SUPERIOR
    ------------------------- */

    .top-bar {
      min-height: 74px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 20px 22px 10px;
    }

    .icon-control {
      width: 44px;
      height: 44px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      color: #e9e9ed;

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;

      background: #1c1c1e;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }

    .icon-control:hover {
      background: #343438;
      border-color: rgba(255,255,255,.26);
    }

    .icon-control:active {
      transform: scale(.91);
    }

    /* -------------------------
       PANTALLA
    ------------------------- */

    .display-area {
      padding: 8px 25px 14px;
      min-height: 212px;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .expression-field {
      width: 100%;

      border: 0;
      border-bottom: 1px solid transparent;

      padding: 7px 0 8px;

      text-align: right;

      color: #a4a4aa;
      background: transparent;

      font-size: clamp(20px, 4.8vw, 25px);
      line-height: 1.3;

      outline: none;
    }

    .expression-field::placeholder {
      color: #65656c;
      opacity: 1;
    }

    .expression-field:focus {
      color: #d0d0d5;
      border-color: rgba(255,255,255,.26);
    }

    .result-display {
      min-height: 78px;

      display: flex;
      justify-content: flex-end;
      align-items: end;

      overflow-wrap: anywhere;

      text-align: right;

      color: white;

      font-size: clamp(56px, 15vw, 82px);
      font-weight: 400;

      line-height: 1.05;
      letter-spacing: -.065em;

      font-variant-numeric: tabular-nums;
    }

    .feedback {
      min-height: 22px;
      margin-top: 8px;

      text-align: right;

      color: #ffb14a;

      font-size: 16px;
      line-height: 1.35;
    }

    /* -------------------------
       TECLADO
    ------------------------- */

    .keypad {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 9px;

      padding: 6px 20px 24px;

      margin-top: auto;
    }

    /* TODOS LOS BOTONES TIENEN
       EXACTAMENTE EL MISMO TAMAÑO */

    .calc-key {
      width: 100%;
      aspect-ratio: 1 / 1;

      min-width: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 50%;

      color: white;

      background: var(--charcoal);

      /* Números grandes */
      font-size: clamp(28px, 7.2vw, 35px);

      font-weight: 400;
      line-height: 1;

      transition:
        transform .12s ease,
        filter .12s ease,
        box-shadow .12s ease;
    }

    .calc-key:hover {
      filter: brightness(1.22);
    }

    .calc-key:active,
    .calc-key.is-pressed {
      transform: scale(.91);
      filter: brightness(1.36);
    }

    /* BOTONES GRISES */

    .calc-key.utility {
      background: var(--gray);
      color: white;
    }

    /* -------------------------
       OPERADORES
       MISMO TAMAÑO QUE TODOS
    ------------------------- */

    .calc-key.operator {
      width: 100%;
      height: auto;

      aspect-ratio: 1 / 1;

      background: var(--orange);
      color: white;

      /* IMPORTANTE:
         quitamos el scale(1.06) */

      transform: none;

      z-index: 1;
    }

    .calc-key.operator:hover {
      filter: brightness(1.22);
    }

    .calc-key.operator:active,
    .calc-key.operator.is-pressed {
      transform: scale(.91);
      filter: brightness(1.36);
    }

    /* Símbolos de operadores GRANDES */

    .calc-key.operator span {
      font-size: clamp(38px, 10vw, 52px) !important;
      font-weight: 400;
      line-height: 1;
    }

    /* Botones normales también con
       símbolos/texto correctamente visibles */

    .calc-key.utility span {
      font-size: clamp(27px, 7vw, 34px) !important;
      line-height: 1;
    }

    /* AC algo más pequeño para que quede elegante */

    #key-clear-label {
      font-size: clamp(23px, 6vw, 29px) !important;
    }

    /* -------------------------
       CERO
    ------------------------- */

    .calc-key.zero {
      grid-column: auto;

      aspect-ratio: 1 / 1;

      border-radius: 50%;

      justify-content: center;
      padding-left: 0;
    }

    /* -------------------------
       HISTORIAL
    ------------------------- */

    .history-panel {
      position: absolute;

      z-index: 5;

      top: 74px;
      left: 14px;
      right: 14px;

      max-height: min(520px, calc(100vh - 120px));

      display: flex;
      flex-direction: column;

      border: 1px solid rgba(255,255,255,.16);
      border-radius: 22px;

      overflow: hidden;

      background: rgba(29,29,31,.98);

      box-shadow: 0 18px 40px rgba(0,0,0,.56);

      opacity: 0;
      pointer-events: none;

      transform: translateY(-8px);

      transition:
        opacity .18s ease,
        transform .18s ease;
    }

    .history-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .history-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 17px 18px 12px;

      border-bottom: 1px solid var(--line);
    }

    .history-clear {
      border: 0;

      color: #ffb14a;
      background: transparent;

      font-size: 15px;
      font-weight: 600;

      padding: 6px;

      border-radius: 8px;
    }

    .history-clear:hover {
      background: rgba(255,149,0,.13);
    }

    .history-list {
      padding: 8px;
      overflow-y: auto;
    }

    .history-empty {
      padding: 26px 16px;

      color: #9a9aa0;

      text-align: center;

      font-size: 14px;
    }

    .history-item {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 14px;

      padding: 12px;

      border: 0;
      border-radius: 14px;

      color: white;

      text-align: left;

      background: transparent;

      transition: background .15s ease;
    }

    .history-item:hover {
      background: rgba(255,255,255,.09);
    }

    .history-expression {
      color: #b6b6ba;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .history-result {
      color: white;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* -------------------------
       RESPONSIVE
    ------------------------- */

    @media (max-width: 380px) {

      .calculator-shell {
        padding: 0;
        background: #000;
      }

      .calculator-panel {
        min-height: 100vh;

        border-radius: 0;
        border: 0;
      }

      .keypad {
        gap: 8px;
        padding: 6px 16px 18px;
      }

      .display-area {
        min-height: 190px;

        padding-left: 20px;
        padding-right: 20px;
      }

      .top-bar {
        padding-left: 18px;
        padding-right: 18px;
      }
    }

    @media (min-width: 700px) {

      .calculator-panel {
        min-height: 780px;
      }

      .keypad {
        gap: 12px;
        padding: 8px 25px 28px;
      }
    }
  </style>

  <!-- PWA -->
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Calculadora estilo Apple, rápida y adaptable.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.json">

</head>

<body>

<main class="calculator-shell">

  <section class="calculator-panel">

    <!-- BARRA SUPERIOR -->

    <header class="top-bar">

      <button
        id="history-toggle"
        class="icon-control"
        type="button"
        aria-label="Abrir historial">

        <i
          data-lucide="list"
          width="22"
          height="22">
        </i>

      </button>

      <button
        id="calculator-mode"
        class="icon-control"
        type="button"
        aria-label="Volver a la calculadora">

        <i
          data-lucide="calculator"
          width="22"
          height="22">
        </i>

      </button>

    </header>

    <!-- HISTORIAL -->

    <aside
      id="history-panel"
      class="history-panel">

      <div class="history-heading">

        <h2
          style="
            color:white;
            font-weight:600;
            font-size:21px;
          ">
          Historial
        </h2>

        <button
          id="history-clear"
          class="history-clear"
          type="button">

          Borrar

        </button>

      </div>

      <div
        id="history-list"
        class="history-list">

        <p
          id="history-empty"
          class="history-empty">

          Aún no hay operaciones.

        </p>

      </div>

    </aside>

    <!-- PANTALLA -->

    <section
      class="display-area">

      <input
        id="expression-input"
        class="expression-field"
        type="text"
        inputmode="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Escribe o pega una operación">

      <output
        id="result-display"
        class="result-display">

        0

      </output>

      <div
        id="feedback"
        class="feedback">
      </div>

    </section>

    <!-- TECLADO -->

    <section class="keypad">

      <!-- FILA 1 -->

      <button
        class="calc-key utility"
        data-action="backspace"
        aria-label="Borrar último carácter">

        <i
          data-lucide="delete"
          width="28"
          height="28">
        </i>

      </button>

      <button
        class="calc-key utility"
        data-action="clear">

        <span id="key-clear-label">
          AC
        </span>

      </button>

      <button
        class="calc-key utility"
        data-value="%">

        <span>
          %
        </span>

      </button>

      <button
        class="calc-key operator"
        data-value="÷">

        <span>
          ÷
        </span>

      </button>


      <!-- FILA 2 -->

      <button class="calc-key" data-value="7">
        <span>7</span>
      </button>

      <button class="calc-key" data-value="8">
        <span>8</span>
      </button>

      <button class="calc-key" data-value="9">
        <span>9</span>
      </button>

      <button class="calc-key operator" data-value="×">
        <span>×</span>
      </button>


      <!-- FILA 3 -->

      <button class="calc-key" data-value="4">
        <span>4</span>
      </button>

      <button class="calc-key" data-value="5">
        <span>5</span>
      </button>

      <button class="calc-key" data-value="6">
        <span>6</span>
      </button>

      <button class="calc-key operator" data-value="−">
        <span>−</span>
      </button>


      <!-- FILA 4 -->

      <button class="calc-key" data-value="1">
        <span>1</span>
      </button>

      <button class="calc-key" data-value="2">
        <span>2</span>
      </button>

      <button class="calc-key" data-value="3">
        <span>3</span>
      </button>

      <button class="calc-key operator" data-value="+">
        <span>+</span>
      </button>


      <!-- FILA 5 -->

      <button
        class="calc-key utility"
        data-action="sign">

        <span>
          +/−
        </span>

      </button>

      <button
        class="calc-key"
        data-value="0">

        <span>
          0
        </span>

      </button>

      <button
        class="calc-key"
        data-value=".">

        <span>
          .
        </span>

      </button>

      <button
        class="calc-key operator"
        data-action="equals">

        <span>
          =
        </span>

      </button>

    </section>

  </section>

</main>


<!-- HISTORIAL -->

<template id="history-item-template">

  <button
    class="history-item"
    type="button">

    <span class="history-expression"></span>

    <strong class="history-result"></strong>

  </button>

</template>


<script>

(() => {

  const input =
    document.getElementById("expression-input");

  const resultDisplay =
    document.getElementById("result-display");

  const feedback =
    document.getElementById("feedback");

  const historyPanel =
    document.getElementById("history-panel");

  const historyToggle =
    document.getElementById("history-toggle");

  const historyList =
    document.getElementById("history-list");

  const historyEmpty =
    document.getElementById("history-empty");

  const history = [];


  const formatter =
    new Intl.NumberFormat("es-ES", {
      maximumFractionDigits: 10,
      useGrouping: true
    });


  function showMessage(message) {

    feedback.textContent = message;

  }


  function normalizeExpression(value) {

    return value

      .replace(/\s+/g, "")

      .replace(/,/g, ".")

      .replace(/[×xX*]/g, "*")

      .replace(/[÷]/g, "/")

      .replace(/[−–]/g, "-");

  }


  function tokenize(source) {

    const expression =
      normalizeExpression(source);

    const tokens = [];

    let index = 0;


    while (index < expression.length) {

      const rest =
        expression.slice(index);


      const number =
        rest.match(
          /^(?:\d+\.\d*|\.\d+|\d+)/
        );


      if (number) {

        tokens.push({
          type: "number",
          value: Number(number[0])
        });

        index += number[0].length;

        continue;

      }


      const char =
        expression[index];


      if ("+-*/%()".includes(char)) {

        tokens.push({
          type: char
        });

        index++;

        continue;

      }


      throw new Error(
        "Usa solo números y operadores permitidos."
      );

    }


    if (!tokens.length) {

      throw new Error(
        "Escribe una operación."
      );

    }


    return tokens;

  }


  function evaluateExpression(source) {

    const tokens =
      tokenize(source);

    let position = 0;


    const peek = () =>
      tokens[position];


    const consume = (type) => {

      if (
        !peek() ||
        peek().type !== type
      ) {

        throw new Error(
          "La expresión está incompleta."
        );

      }

      return tokens[position++];

    };


    function parseExpression() {

      let value =
        parseTerm();


      while (
        peek() &&
        (
          peek().type === "+" ||
          peek().type === "-"
        )
      ) {

        const operator =
          tokens[position++].type;

        const right =
          parseTerm();


        value =
          operator === "+"
            ? value + right
            : value - right;

      }


      return value;

    }


    function parseTerm() {

      let value =
        parseUnary();


      while (
        peek() &&
        (
          peek().type === "*" ||
          peek().type === "/"
        )
      ) {

        const operator =
          tokens[position++].type;

        const right =
          parseUnary();


        if (
          operator === "/" &&
          right === 0
        ) {

          throw new Error(
            "No se puede dividir entre cero."
          );

        }


        value =
          operator === "*"
            ? value * right
            : value / right;

      }


      return value;

    }


    function parseUnary() {

      if (
        peek() &&
        peek().type === "+"
      ) {

        position++;

        return parseUnary();

      }


      if (
        peek() &&
        peek().type === "-"
      ) {

        position++;

        return -parseUnary();

      }


      return parsePostfix();

    }


    function parsePostfix() {

      let value =
        parsePrimary();


      while (
        peek() &&
        peek().type === "%"
      ) {

        position++;

        value /= 100;

      }


      return value;

    }


    function parsePrimary() {

      if (
        peek() &&
        peek().type === "number"
      ) {

        return tokens[position++].value;

      }


      if (
        peek() &&
        peek().type === "("
      ) {

        position++;

        const value =
          parseExpression();

        consume(")");

        return value;

      }


      throw new Error(
        "Revisa la operación."
      );

    }


    const value =
      parseExpression();


    if (
      position !== tokens.length
    ) {

      throw new Error(
        "Revisa la operación."
      );

    }


    if (
      !Number.isFinite(value)
    ) {

      throw new Error(
        "El resultado no es válido."
      );

    }


    return value;

  }


  function formatResult(value) {

    const cleaned =
      Math.abs(value) < 1e-12
        ? 0
        : value;

    return formatter.format(cleaned);

  }


  function updatePreview() {

    // Estilo Apple: AC cuando está vacío y C cuando hay contenido.
    const clearLabel =
      document.getElementById("key-clear-label");

    clearLabel.textContent =
      input.value.trim() ? "C" : "AC";


    const current =
      input.value.trim();


    if (!current) {

      resultDisplay.textContent = "0";

      showMessage("");

      return;

    }


    try {

      resultDisplay.textContent =
        formatResult(
          evaluateExpression(current)
        );

      showMessage("");

    } catch (error) {

      resultDisplay.textContent = "—";

      showMessage(error.message);

    }

  }


  function addHistory(
    expression,
    result
  ) {

    if (
      history[0] &&
      history[0].expression === expression
    ) {

      return;

    }


    history.unshift({
      expression,
      result
    });


    if (history.length > 12) {

      history.pop();

    }


    renderHistory();

  }


  function renderHistory() {

    historyList
      .querySelectorAll(".history-item")
      .forEach(
        item => item.remove()
      );


    historyEmpty.hidden =
      history.length > 0;


    history.forEach(entry => {

      const fragment =
        document
          .getElementById(
            "history-item-template"
          )
          .content
          .cloneNode(true);


      const button =
        fragment.querySelector(
          ".history-item"
        );


      button.querySelector(
        ".history-expression"
      ).textContent =
        entry.expression;


      button.querySelector(
        ".history-result"
      ).textContent =
        entry.result;


      button.addEventListener(
        "click",
        () => {

          input.value =
            entry.expression;

          updatePreview();

          closeHistory();

          input.focus();

        }
      );


      historyList.appendChild(
        fragment
      );

    });

  }


  function calculate() {

    const expression =
      input.value.trim();


    if (!expression) {

      showMessage(
        "Escribe una operación."
      );

      return;

    }


    try {

      const value =
        evaluateExpression(
          expression
        );


      const formatted =
        formatResult(value);


      resultDisplay.textContent =
        formatted;


      showMessage("");


      addHistory(
        expression,
        formatted
      );


    } catch (error) {

      resultDisplay.textContent =
        "—";

      showMessage(
        error.message
      );

    }

  }


  function appendValue(value) {

    input.focus();


    const start =
      input.selectionStart;

    const end =
      input.selectionEnd;


    const inserted =
      value === "÷"
        ? " ÷ "
        : value === "×"
        ? " × "
        : value;


    input.setRangeText(
      inserted,
      start,
      end,
      "end"
    );


    updatePreview();

  }


  function backspace() {

    const start =
      input.selectionStart;

    const end =
      input.selectionEnd;


    if (start !== end) {

      input.setRangeText(
        "",
        start,
        end,
        "end"
      );

    }

    else if (start > 0) {

      input.setRangeText(
        "",
        start - 1,
        end,
        "end"
      );

    }


    input.focus();

    updatePreview();

  }


  function toggleSign() {

    const start =
      input.selectionStart;

    const end =
      input.selectionEnd;


    if (start !== end) {

      const selected =
        input.value.slice(
          start,
          end
        );


      input.setRangeText(

        selected.startsWith("-")
          ? selected.slice(1)
          : "-" + selected,

        start,
        end,
        "select"

      );

    }

    else {

      input.setRangeText(
        "-",
        start,
        end,
        "end"
      );

    }


    input.focus();

    updatePreview();

  }


  function closeHistory() {

    historyPanel.classList.remove(
      "open"
    );

    historyToggle.setAttribute(
      "aria-expanded",
      "false"
    );

  }


  document
    .querySelectorAll(".calc-key")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const action =
            button.dataset.action;


          if (
            action === "equals"
          ) {

            calculate();

          }

          else if (
            action === "clear"
          ) {

            input.value = "";

            input.focus();

            updatePreview();

          }

          else if (
            action === "backspace"
          ) {

            backspace();

          }

          else if (
            action === "sign"
          ) {

            toggleSign();

          }

          else {

            appendValue(
              button.dataset.value
            );

          }

        }
      );

    });


  input.addEventListener(
    "input",
    updatePreview
  );


  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" ||
        event.key === "="
      ) {

        event.preventDefault();

        calculate();

      }


      if (
        event.key === "Escape"
      ) {

        closeHistory();

      }

    }
  );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.target === input
      ) {

        return;

      }


      if (
        event.key === "Enter" ||
        event.key === "="
      ) {

        event.preventDefault();

        calculate();

      }

      else if (
        event.key === "Backspace"
      ) {

        event.preventDefault();

        backspace();

      }

      else if (
        event.key === "Escape"
      ) {

        closeHistory();

      }

      else if (
        /^[0-9+\-*/%.()]$/.test(
          event.key
        )
      ) {

        event.preventDefault();

        appendValue(
          event.key
        );

      }

    }
  );


  historyToggle.addEventListener(
    "click",
    () => {

      const isOpen =
        historyPanel.classList.toggle(
          "open"
        );


      historyToggle.setAttribute(
        "aria-expanded",
        String(isOpen)
      );

    }
  );


  document
    .getElementById("calculator-mode")
    .addEventListener(
      "click",
      () => {

        closeHistory();

        input.focus();

      }
    );


  document
    .getElementById("history-clear")
    .addEventListener(
      "click",
      () => {

        history.length = 0;

        renderHistory();

      }
    );


  lucide.createIcons();

  updatePreview();

})();

</script>


  <script>
    // Registrar Service Worker para permitir instalación y funcionamiento offline.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => console.error("Error registrando Service Worker:", error));
      });
    }
  </script>
